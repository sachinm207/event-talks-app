<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BigQuery Release Notes Radar</title>
    <meta name="description" content="Live release notes tracker and X/Twitter sharing tool for Google Cloud BigQuery.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-container">
        <!-- Navigation Header -->
        <header class="navbar">
            <div class="brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div class="brand-text">
                    <h1>BigQuery <span class="accent-text">Radar</span></h1>
                    <span class="sub-tag">Official Release Notes & X/Twitter Sharer</span>
                </div>
            </div>

            <div class="header-actions">
                <div class="status-badge" id="status-badge">
                    <span class="status-dot"></span>
                    <span id="status-text">Connected</span>
                </div>

                <!-- Refresh Button with Spinner -->
                <button id="refresh-btn" class="btn btn-primary" title="Refresh Release Notes">
                    <svg class="spinner-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M23 4v6h-6M1 20v-6h6"></path>
                        <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"></path>
                    </svg>
                    <span class="btn-label">Refresh Feed</span>
                </button>

                <!-- Dark/Light Theme Switcher -->
                <button id="theme-toggle" class="btn btn-icon" title="Toggle Light/Dark Theme">
                    <svg class="sun-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg class="moon-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Filter & Search Controls -->
            <section class="controls-card">
                <div class="search-box">
                    <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="search-input" placeholder="Search BigQuery release notes (e.g. cross-cloud, transfer, SQL, partition)...">
                    <button id="search-clear" class="clear-btn" title="Clear Search">&times;</button>
                </div>

                <div class="filter-bar">
                    <div class="category-pills" id="category-pills">
                        <button class="pill active" data-category="All">All Updates</button>
                        <!-- Dynamic pills inserted via JS -->
                    </div>

                    <div class="control-meta">
                        <span id="update-count" class="count-badge">Loading...</span>
                        <span id="last-sync-time" class="sync-time">Last sync: --</span>
                    </div>
                </div>
            </section>

            <!-- Release Notes Feed Stream -->
            <section class="feed-container">
                <div id="release-notes-list" class="notes-grid">
                    <!-- Skeleton Loader State -->
                    <div class="card skeleton-card"></div>
                    <div class="card skeleton-card"></div>
                    <div class="card skeleton-card"></div>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>BigQuery Release Notes Radar • Data fetched directly from <a href="https://docs.cloud.google.com/feeds/bigquery-release-notes.xml" target="_blank" rel="noopener">Google Cloud Official Feed</a></p>
        </footer>
    </div>

    <!-- Tweet Composer Modal -->
    <div id="tweet-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-title">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" class="x-logo">
                        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                    </svg>
                    <h2>Tweet This BigQuery Update</h2>
                </div>
                <button class="modal-close" id="modal-close-btn">&times;</button>
            </div>

            <div class="modal-body">
                <div class="tweet-box-container">
                    <label for="tweet-textarea" class="input-label">Compose Tweet Draft:</label>
                    <textarea id="tweet-textarea" rows="6" maxlength="280"></textarea>
                    
                    <div class="char-counter-row">
                        <div class="progress-bar-bg">
                            <div id="char-progress-bar" class="progress-bar-fill"></div>
                        </div>
                        <span id="char-count-text">0 / 280</span>
                    </div>
                </div>

                <div class="hashtag-section">
                    <span class="hashtag-label">Quick Hashtags:</span>
                    <div class="hashtag-chips">
                        <button class="chip hashtag-chip" data-tag="#BigQuery">#BigQuery</button>
                        <button class="chip hashtag-chip" data-tag="#GoogleCloud">#GoogleCloud</button>
                        <button class="chip hashtag-chip" data-tag="#DataEngineering">#DataEngineering</button>
                        <button class="chip hashtag-chip" data-tag="#GCP">#GCP</button>
                        <button class="chip hashtag-chip" data-tag="#DataWarehouse">#DataWarehouse</button>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button id="copy-tweet-btn" class="btn btn-secondary">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path>
                    </svg>
                    Copy Text
                </button>
                <button id="post-x-btn" class="btn btn-x-primary">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                    </svg>
                    Post to X (Twitter)
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notification Popup -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Application Script -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
